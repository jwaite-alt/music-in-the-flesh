backend:
  name: github
  repo: jwaite-alt/music-in-the-flesh
  branch: staging
  base_url: https://staging.musicintheflesh.org
  auth_endpoint: /oauth/auth

# Where media uploads go
media_folder: public/images/uploads
public_folder: /images/uploads

# ── Collections ────────────────────────────────────────────

collections:

  # ── Home Page ────────────────────────────────────────────
  - name: home
    label: "Home Page"
    files:
      - name: home
        label: "Home Page"
        file: src/content/pages/home.md
        fields:
          - { label: "Hero introduction", name: hero_intro, widget: text, hint: "Short paragraph shown in the hero banner." }
          - { label: "Book description", name: body, widget: markdown, hint: "Descriptive text about the book, shown below the hero." }

  # ── About ────────────────────────────────────────────────
  - name: about
    label: "About"
    files:
      - name: about-project
        label: "About"
        file: src/content/pages/about-project.md
        fields:
          - { label: "Title", name: title, widget: string }
          - { label: "Project description", name: body, widget: markdown, hint: "Full description of the project and its intellectual aims." }

  # ── Biographies ──────────────────────────────────────────
  - name: bios
    label: Biographies
    label_singular: Biography
    folder: src/content/bios
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: ["order", "name"]
    fields:
      - { label: "Full name", name: name, widget: string }
      - { label: "Role / affiliation", name: role, widget: string, required: false, hint: "Shown beneath the name, e.g. 'Professor of Music History · University of Cambridge'" }
      - { label: "Display order", name: order, widget: number, default: 99, hint: "1 = first. Bettina Varwig is 1." }
      - { label: "Photo", name: photo, widget: image, required: false }
      - { label: "Biography", name: body, widget: markdown, hint: "Full biography text, publications, contact details etc." }

  # ── Media — Videos ───────────────────────────────────────
  - name: videos
    label: "Media — Videos"
    label_singular: Video
    folder: src/content/videos
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Short description", name: description, widget: text, hint: "Shown in listings and previews." }
      - { label: "Embed URL", name: embedUrl, widget: string, required: false, hint: "YouTube or Vimeo embed URL (e.g. https://www.youtube.com/embed/xxxxx). Leave blank if using self-hosted video files below." }
      - { label: "Video file (H264 / .mp4)", name: videoUrl, widget: string, required: false, hint: "Path to self-hosted H264 file, e.g. /videos/my-video.mp4" }
      - { label: "Video file (H265 / .mp4)", name: videoUrlH265, widget: string, required: false, hint: "Path to self-hosted H265 file, e.g. /videos/my-video-h265.mp4. Safari will use this; other browsers fall back to H264." }
      - { label: "Thumbnail image", name: thumbnail, widget: image, required: false, hint: "Required for self-hosted videos. YouTube embeds generate their own thumbnail automatically." }
      - { label: "Feature on homepage", name: featured, widget: boolean, default: false, hint: "Tick to show this item in the homepage media preview." }
      - { label: "Notes", name: body, widget: markdown, required: false, hint: "Optional additional text shown on the video page." }
      - { label: "Draft (hidden)", name: draft, widget: boolean, default: false, required: false }

  # ── Media — Photography ──────────────────────────────────
  - name: galleries
    label: "Media — Photography"
    label_singular: Gallery
    folder: src/content/galleries
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Short description", name: description, widget: text, hint: "Shown in listings and previews." }
      - { label: "Feature on homepage", name: featured, widget: boolean, default: false, hint: "Tick to show this item in the homepage media preview." }
      - label: "Photos"
        name: images
        widget: list
        hint: "Add photos one by one. Captions are optional."
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: "Notes", name: body, widget: markdown, required: false, hint: "Optional text shown on the gallery page." }
      - { label: "Draft (hidden)", name: draft, widget: boolean, default: false, required: false }

  # ── Media — Words ────────────────────────────────────────
  - name: words
    label: "Media — Words"
    label_singular: "Words item"
    folder: src/content/words
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Short description", name: description, widget: text, hint: "Shown in listings and previews." }
      - { label: "Cover / thumbnail image", name: cover, widget: image, required: false }
      - { label: "Award or accolade", name: award, widget: string, required: false, hint: "e.g. 'Winner, Otto Kinkeldey Award'" }
      - { label: "External URL", name: external_url, widget: string, required: false, hint: "If this item is hosted elsewhere (e.g. a blog post), paste the URL here. The listing will link directly to it, bypassing the site page." }
      - { label: "Buy / publisher link", name: buy_url, widget: string, required: false }
      - { label: "Buy button label", name: buy_label, widget: string, required: false, default: "Buy" }
      - { label: "Download URL", name: download_url, widget: string, required: false, hint: "Path to a PDF or other file, e.g. /downloads/my-essay.pdf" }
      - { label: "Download button label", name: download_label, widget: string, required: false, default: "Download" }
      - { label: "Feature on homepage", name: featured, widget: boolean, default: false, hint: "Tick to show this item in the homepage media preview." }
      - { label: "Full text", name: body, widget: markdown, hint: "Full content shown on the item's own page." }
      - { label: "Draft (hidden)", name: draft, widget: boolean, default: false, required: false }

  # ── Upcoming ─────────────────────────────────────────────
  - name: events
    label: Upcoming
    label_singular: Event
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Venue", name: venue, widget: string }
      - { label: "Location (city)", name: location, widget: string, required: false }
      - { label: "Short description", name: description, widget: text, hint: "Shown in the events listing." }
      - { label: "Ticket / booking URL", name: ticketUrl, widget: string, required: false }
      - { label: "Body", name: body, widget: markdown, required: false, hint: "Any additional detail shown when the event has its own page." }
      - { label: "Draft (hidden)", name: draft, widget: boolean, default: false, required: false }

  # ── Archive ──────────────────────────────────────────────
  - name: performances
    label: Archive
    label_singular: Performance
    folder: src/content/performances
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Venue", name: venue, widget: string }
      - { label: "Location (city)", name: location, widget: string, required: false }
      - { label: "Short description", name: description, widget: text, hint: "Used in listings and previews. 1–3 sentences." }
      - { label: "Featured performance", name: featured, widget: boolean, default: false, hint: "Tick to show this as a current/upcoming performance on the home page." }
      - { label: "Video URL", name: videoUrl, widget: string, required: false, hint: "Paste a YouTube or Vimeo embed URL (e.g. https://www.youtube.com/embed/xxxxx)" }
      - { label: "Feedback form URL", name: feedbackFormUrl, widget: string, required: false, hint: "Paste the Google Form embed URL for this performance." }
      - label: "Images"
        name: images
        widget: list
        required: false
        hint: "Add photos for this performance. For multiple images a slideshow will be shown automatically."
        fields:
          - { label: "Image", name: image, widget: image }
          - { label: "Caption", name: caption, widget: string, required: false, hint: "Optional caption shown beneath the image." }
      - { label: "Body", name: body, widget: markdown, hint: "Full description, programme notes, reflections. This appears on the individual performance page." }
      - { label: "Draft (hidden)", name: draft, widget: boolean, default: false, hint: "Tick to hide this from the site." }
